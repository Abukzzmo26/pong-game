<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>PONG GAME</h1>
        <div class="scoreboard">
            <div class="score">
                <span>Player</span>
                <div id="playerScore">0</div>
            </div>
            <div class="score">
                <span>Computer</span>
                <div id="computerScore">0</div>
            </div>
        </div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div class="instructions">
            <p><strong>Controls:</strong></p>
            <p>🖱️ Mouse: Move left paddle</p>
            <p>⬆️⬇️ Arrow Keys: Move left paddle</p>
            <p>Computer automatically controls right paddle</p>
            <p>Press SPACE to start/reset game</p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
